# Repo-root Railway config. Build context is this directory so
# agent/Dockerfile can COPY content/resumedump.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "agent/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
